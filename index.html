<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>泰國家族旅遊 2026 - 倒數計時</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body { font-family: 'Noto+Sans+TC', sans-serif; }
    </style>
</head>
<body class="bg-orange-50 text-gray-800 min-h-screen flex flex-col">
    <nav class="p-6 flex justify-between items-center bg-white/80 backdrop-blur-md sticky top-0 z-50 shadow-sm">
        <h1 class="text-2xl font-bold text-orange-600">🇹🇭 泰國旅遊 2026</h1>
        <div class="flex items-center space-x-6">
            <span id="exchange-rate" class="hidden md:inline-block bg-orange-100 text-orange-600 px-3 py-1 rounded-full text-xs font-bold">匯率載入中...</span>
            <a href="index.html" class="hover:text-orange-500 font-bold transition-colors">首頁</a>
            <a href="itinerary.html" class="hover:text-orange-500 transition-colors">行程總覽</a>
        </div>
    </nav>

    <script>
        async function updateExchangeRate() {
            try {
                const response = await fetch('https://open.er-api.com/v6/latest/THB');
                const data = await response.json();
                const rate = data.rates.TWD;
                document.getElementById('exchange-rate').innerText = `1 THB ≈ ${rate.toFixed(2)} TWD`;
            } catch (error) {
                console.error('Failed to fetch exchange rate', error);
                document.getElementById('exchange-rate').innerText = '1 THB ≈ 0.94 TWD';
            }
        }
        updateExchangeRate();
    </script>

    <main class="flex-grow flex flex-col items-center justify-center py-20 px-6 text-center relative overflow-hidden">
        <!-- Background Decoration -->
        <div class="absolute top-0 left-0 w-64 h-64 bg-orange-200 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-pulse"></div>
        <div class="absolute bottom-0 right-0 w-96 h-96 bg-yellow-200 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-pulse" style="animation-delay: 2s;"></div>

        <div class="relative z-10">
            <h2 class="text-5xl md:text-7xl font-extrabold mb-4 text-gray-900 tracking-tight">汪家泰國大冒險</h2>
            <p class="text-xl md:text-2xl text-orange-600 font-medium mb-12">DEPARTURE: 2026.08.08</p>
            
            <div id="countdown" class="grid grid-cols-2 md:grid-cols-4 gap-6 mb-16 max-w-3xl mx-auto">
                <div class="bg-white/90 backdrop-blur p-8 rounded-3xl shadow-2xl border border-orange-100 transform hover:scale-105 transition-transform">
                    <span id="days" class="block text-6xl font-black text-orange-600">00</span>
                    <span class="text-xs text-gray-400 uppercase tracking-widest mt-2 block font-bold">Days / 天</span>
                </div>
                <div class="bg-white/90 backdrop-blur p-8 rounded-3xl shadow-2xl border border-orange-100 transform hover:scale-105 transition-transform">
                    <span id="hours" class="block text-6xl font-black text-orange-600">00</span>
                    <span class="text-xs text-gray-400 uppercase tracking-widest mt-2 block font-bold">Hrs / 時</span>
                </div>
                <div class="bg-white/90 backdrop-blur p-8 rounded-3xl shadow-2xl border border-orange-100 transform hover:scale-105 transition-transform">
                    <span id="minutes" class="block text-6xl font-black text-orange-600">00</span>
                    <span class="text-xs text-gray-400 uppercase tracking-widest mt-2 block font-bold">Mins / 分</span>
                </div>
                <div class="bg-white/90 backdrop-blur p-8 rounded-3xl shadow-2xl border border-orange-100 transform hover:scale-105 transition-transform">
                    <span id="seconds" class="block text-6xl font-black text-orange-600">00</span>
                    <span class="text-xs text-gray-400 uppercase tracking-widest mt-2 block font-bold">Secs / 秒</span>
                </div>
            </div>

            <p class="text-xl text-gray-600 mb-12 max-w-lg mx-auto leading-relaxed">
                準備好迎接陽光、沙灘、泰奶和 <span class="font-bold text-orange-600">IconSiam</span> 了嗎？<br>
                這將是我們最難忘的家庭旅行！
            </p>
            
            <a href="itinerary.html" class="inline-block bg-gradient-to-r from-orange-500 to-orange-700 text-white px-12 py-5 rounded-full font-bold text-xl hover:shadow-2xl hover:-translate-y-1 transition-all active:scale-95 shadow-xl">
                探索 8 天驚喜行程 →
            </a>
        </div>
    </main>

    <footer class="py-10 text-center text-gray-400 text-sm">
        © 2026 汪家泰國之旅 | Designed for Mac & Fiona
    </footer>


    <script>
        const targetDate = new Date("2026-08-08T00:00:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days.toString().padStart(2, '0');
            document.getElementById("hours").innerText = hours.toString().padStart(2, '0');
            document.getElementById("minutes").innerText = minutes.toString().padStart(2, '0');
            document.getElementById("seconds").innerText = seconds.toString().padStart(2, '0');

            if (distance < 0) {
                clearInterval(interval);
                document.getElementById("countdown").innerHTML = "<h2 class='text-5xl font-black text-orange-600 w-full'>就是今天！我們出發啦！✈️</h2>";
            }
        }

        const interval = setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
